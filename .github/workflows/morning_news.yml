name: "SFNI 아침 뉴스 수집 (08:00 KST)"

on:
  schedule:
    - cron: "0 23 * * 0-4"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  morning-update:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pykrx requests pandas numpy

      - name: Run morning news collection
        run: python scripts/auto_update.py --mode morning

      - name: Check for changes
        id: changes
        run: |
          git add data/ public/data/
          if git diff --staged --quiet; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            git diff --staged --stat
          fi

      - name: Commit & push changes
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "auto: 아침 뉴스 업데이트 $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M')"
          git push
