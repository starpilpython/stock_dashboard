name: "SFNI 아침 뉴스 수집 (08:00 KST)"

on:
  schedule:
    # 한국시간 08:00 = UTC 23:00 (전날)
    - cron: "0 23 * * 0-4"
  workflow_dispatch:  # 수동 실행 가능

jobs:
  morning-update:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pykrx requests pandas numpy

      - name: Run morning news collection
        run: python scripts/auto_update.py --mode morning

      - name: Commit & push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ public/data/
          # 변경사항이 있을 때만 커밋
          git diff --staged --quiet || git commit -m "auto: 아침 뉴스 업데이트 $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M')"
          git push
