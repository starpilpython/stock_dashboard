name: "SFNI 장 마감 뉴스 업데이트 (16:30 KST)"

on:
  schedule:
    # 한국시간 16:30 = UTC 07:30
    - cron: "30 7 * * 1-5"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  TZ: Asia/Seoul

jobs:
  closing-news:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pykrx requests pandas numpy

      - name: Run news collection + JSON rebuild
        run: python scripts/auto_update.py --mode morning

      - name: Check for changes
        id: changes
        run: |
          git add data/ public/data/
          if git diff --staged --quiet; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            git diff --staged --stat
          fi

      - name: Commit & push changes
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "auto: 장 마감 뉴스 업데이트 $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M')"
          git push
